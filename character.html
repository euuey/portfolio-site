<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CHARACTER DESIGN | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      .sub-page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 24px;
        padding: 120px 35px;
      }
      .sub-page h1 {
        font-family: 'Albert Sans', sans-serif;
        font-size: 36px;
        font-weight: 700;
        color: #fff;
      }
      .project-tags {
        display: flex;
        gap: 8px;
      }
      .project-tag {
        font-family: 'Pretendard', sans-serif;
        font-size: 14px;
        font-weight: 500;
        color: #fff;
        background: #333;
        padding: 6px 14px;
        border-radius: 4px;
      }
      .sub-page p {
        font-family: 'Pretendard', sans-serif;
        font-size: 18px;
        color: #888;
      }
      .list-link {
        display: inline-block;
        font-family: 'Pretendard', sans-serif;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        text-decoration: none;
        padding: 14px 36px;
        border: 1px solid #333;
        border-radius: 50px;
        transition: background 0.3s, border-color 0.3s;
        margin-top: 40px;
      }
      .list-link:hover {
        background: #1a1a1a;
        border-color: #555;
      }
      .back-link {
        font-family: 'Albert Sans', sans-serif;
        font-size: 16px;
        color: #3b82f6;
        text-decoration: none;
        margin-top: 20px;
        transition: opacity 0.3s;
      }
      .back-link:hover {
        opacity: 0.6;
      }
      .project-section {
        width: 100%;
        max-width: 1200px;
        padding: 40px 0;
        border-top: 1px solid #222;
      }
      .section-label {
        font-family: 'Pretendard', sans-serif;
        font-size: 16px;
        font-weight: 700;
        color: #3b82f6;
        letter-spacing: 0.05em;
        margin-bottom: 20px;
        display: block;
      }
      .section-desc {
        font-family: 'Pretendard', sans-serif;
        font-size: 18px;
        font-weight: 400;
        color: #ccc;
        line-height: 1.8;
      }
      .project-meta {
        display: flex;
        gap: 16px;
        padding: 24px 0;
        width: 100%;
        max-width: 1200px;
      }
      .meta-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        background: #111;
        border-radius: 16px;
        padding: 28px 20px;
      }
      .meta-label {
        font-family: 'Albert Sans', sans-serif;
        font-size: 13px;
        font-weight: 600;
        color: #555;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .meta-value {
        font-family: 'Albert Sans', sans-serif;
        font-size: 28px;
        font-weight: 800;
        color: #fff;
      }
      @media (max-width: 768px) {
        .sub-page {
          padding: 100px 20px;
          gap: 20px;
        }
        .sub-page h1 {
          font-size: 28px;
        }
        .project-meta {
          flex-direction: column;
          gap: 12px;
        }
        .meta-value {
          font-size: 22px;
        }
        .project-section {
          padding: 24px 0;
        }
        .section-desc {
          font-size: 16px;
        }
        .section-desc br {
          display: none;
        }
        .list-link {
          padding: 12px 28px;
          font-size: 14px;
          margin-top: 28px;
        }
        .back-link {
          margin-top: 20px;
        }
      }
    </style>
  </head>
  <body>
    <header class="header">
      <a href="index.html" class="logo">
        <img src="img/logo.svg" alt="Logo" />
      </a>
      <nav class="nav">
        <ul class="nav-list">
          <li><a href="projects.html">PROJECT</a></li>
          <li><a href="index.html#contact">INTRODUCTION</a></li>
        </ul>
      </nav>
    </header>

    <main class="sub-page">
      <img src="img/character.png" alt="LH 캐릭터 리디자인" style="width: 100%; max-width: 1200px; border-radius: 20px;" />
      <h1>CHARACTER DESIGN</h1>
      <div class="project-tags">
        <span class="project-tag">캐릭터디자인</span>
        <span class="project-tag">개인프로젝트</span>
      </div>
      <div class="project-meta">
        <div class="meta-item">
          <span class="meta-label">Team</span>
          <span class="meta-value">1명</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Contribution</span>
          <span class="meta-value">100%</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Duration</span>
          <span class="meta-value">3일</span>
        </div>
      </div>
      <div class="project-section">
        <span class="section-label">LH 캐릭터 리디자인</span>
        <p class="section-desc">
          LH 캐릭터를 새로운 시각으로 리디자인한 개인 프로젝트입니다.<br />
          기존 캐릭터의 정체성을 유지하면서도<br />
          현대적인 감각과 친근한 인상을 더하는 것을 목표로 작업했습니다.
        </p>
      </div>
      <div style="margin-top: 40px; width: 100%; max-width: 1200px; overflow: hidden; background-color: #000; position: relative; display: flex; justify-content: center; align-items: flex-end; gap: 40px; padding: 40px 40px; border-top: 2px solid rgba(255,255,255,0.8); border-bottom: 2px solid rgba(255,255,255,0.8);">
        <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;" preserveAspectRatio="none">
          <line x1="0" y1="25%" x2="100%" y2="25%" stroke="rgba(255,255,255,0.6)" stroke-width="1" stroke-dasharray="8,6" />
          <line x1="0" y1="50%" x2="100%" y2="50%" stroke="rgba(255,255,255,0.6)" stroke-width="1" stroke-dasharray="8,6" />
          <line x1="0" y1="75%" x2="100%" y2="75%" stroke="rgba(255,255,255,0.6)" stroke-width="1" stroke-dasharray="8,6" />
        </svg>
        <img src="img/character_03.svg" alt="LH 캐릭터 크기 비교 (대)" style="max-width: 60%; object-fit: contain; position: relative; z-index: 1;" />
        <img src="img/character_04.svg" alt="LH 캐릭터 크기 비교 (소)" style="max-width: 30%; object-fit: contain; position: relative; z-index: 1;" />
      </div>
      <img src="img/character_05.svg" alt="LH 캐릭터 표정 모음" style="margin-top: 16px; width: 100%; max-width: 1200px; border-radius: 20px;" />
      <a href="projects.html" class="list-link">&larr; 목록으로</a>
      <a href="index.html" class="back-link">&larr; Back to Portfolio</a>
    </main>
  </body>
</html>
