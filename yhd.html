<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YHD | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      .sub-page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 24px;
        padding: 120px 35px;
      }
      .sub-page h1 {
        font-family: 'Albert Sans', sans-serif;
        font-size: 36px;
        font-weight: 700;
        color: #fff;
      }
      .project-tags {
        display: flex;
        gap: 8px;
      }
      .project-tag {
        font-family: 'Pretendard', sans-serif;
        font-size: 14px;
        font-weight: 500;
        color: #fff;
        background: #333;
        padding: 6px 14px;
        border-radius: 4px;
      }
      .sub-page p {
        font-family: 'Pretendard', sans-serif;
        font-size: 18px;
        color: #888;
      }
      .project-nav {
        display: flex;
        justify-content: space-between;
        width: 100%;
        max-width: 1200px;
        margin-top: 40px;
      }
      .nav-prev,
      .nav-next {
        font-family: 'Albert Sans', sans-serif;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        text-decoration: none;
        padding: 12px 28px;
        border: 1px solid #333;
        border-radius: 50px;
        transition: background 0.3s, border-color 0.3s;
      }
      .nav-prev:hover,
      .nav-next:hover {
        background: #1a1a1a;
        border-color: #555;
      }
      .nav-arrow {
        font-weight: 700;
      }
      .list-link {
        display: inline-block;
        font-family: 'Pretendard', sans-serif;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        text-decoration: none;
        padding: 14px 36px;
        border: 1px solid #333;
        border-radius: 50px;
        transition: background 0.3s, border-color 0.3s;
        margin-top: 40px;
      }
      .list-link:hover {
        background: #1a1a1a;
        border-color: #555;
      }
      .back-link {
        font-family: 'Albert Sans', sans-serif;
        font-size: 16px;
        color: #3b82f6;
        text-decoration: none;
        margin-top: 20px;
        transition: opacity 0.3s;
      }
      .back-link:hover {
        opacity: 0.6;
      }
      .project-section {
        width: 100%;
        max-width: 1200px;
        padding: 40px 0;
        border-top: 1px solid #222;
      }
      .section-label {
        font-family: 'Pretendard', sans-serif;
        font-size: 16px;
        font-weight: 700;
        color: #3b82f6;
        letter-spacing: 0.05em;
        margin-bottom: 20px;
        display: block;
      }
      .section-desc {
        font-family: 'Pretendard', sans-serif;
        font-size: 18px;
        font-weight: 400;
        color: #ccc;
        line-height: 1.8;
      }
      @media (max-width: 768px) {
        .sub-page {
          padding: 100px 20px;
          gap: 20px;
        }
        .sub-page h1 {
          font-size: 28px;
        }
        .project-section {
          padding: 24px 0;
        }
        .section-desc {
          font-size: 16px;
        }
        .section-desc br {
          display: none;
        }
        .project-nav {
          margin-top: 28px;
        }
        .nav-prev,
        .nav-next {
          padding: 10px 20px;
          font-size: 14px;
        }
        .list-link {
          padding: 12px 28px;
          font-size: 14px;
          margin-top: 28px;
        }
        .back-link {
          margin-top: 20px;
        }
      }
    </style>
  </head>
  <body>
    <header class="header">
      <a href="index.html" class="logo">
        <img src="img/logo.svg" alt="Logo" />
      </a>
      <nav class="nav">
        <ul class="nav-list">
          <li><a href="projects.html">PROJECT</a></li>
          <li><a href="index.html#contact">INTRODUCTION</a></li>
        </ul>
      </nav>
    </header>

    <main class="sub-page">
      <img src="img/yhd.png" alt="YHD" style="width: 100%; max-width: 1200px; border-radius: 20px;" />
      <h1>YHD</h1>
      <div class="project-tags">
        <span class="project-tag">그래픽디자인</span>
      </div>
      <div class="project-section">
        <span class="section-label">그래픽 디자인</span>
        <p class="section-desc">
          YHD 브랜드를 주제로 한 그래픽 디자인 개인 프로젝트입니다.<br />
          타이포그래피와 컬러를 활용하여<br />
          브랜드의 감성과 아이덴티티를 시각적으로 표현했습니다.
        </p>
      </div>
      <div class="project-nav">
        <a href="cgv.html" class="nav-prev"><span class="nav-arrow">&lt;</span> Prev</a>
        <a href="kyungdong.html" class="nav-next">Next <span class="nav-arrow">&gt;</span></a>
      </div>
      <a href="projects.html" class="list-link">&larr; 목록으로</a>
      <a href="index.html" class="back-link">&larr; Back to Portfolio</a>
    </main>
  </body>
</html>
